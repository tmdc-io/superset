{{- if .Values.ingress.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tls | replace "." "-" }}
  namespace: dataos-system
spec:
  dnsNames:
    - {{ index .Values.ingress.hosts 0 }}
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: letsencrypt
  keystores:
    jks:
      create: true
      passwordSecretRef:
        key: password-key
        name: jks-password-secret
  secretName: {{ .Values.ingress.tls | replace "." "-" }}
{{- end }}
